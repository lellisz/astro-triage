name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dl.txt

      # requirements-dl.txt = requirements.txt + torch (pin 2.11.0). The tests import torch;
      # the CPU index avoids the multi-GB CUDA wheel that PyPI serves on Linux.
      - name: Install dependencies
        run: >
          python -m pip install -r requirements-dl.txt
          --extra-index-url https://download.pytorch.org/whl/cpu

      # The repo has no ruff config (no pyproject.toml/ruff.toml): ruff defaults apply.
      - name: Lint (ruff)
        run: python -m ruff check .

      # data/ is gitignored and absent in CI; tests must not depend on it.
      - name: Test (pytest)
        run: python -m pytest -q

  # Static site (web/): lint, typecheck, build against the synthetic fixture, then tests.
  # No Python and no data/ here: the build reads only web/test/fixtures (ADR 0008, W10).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fixture build writes web/out; static.test.ts inspects it, so build must precede test.
      - name: Build (fixture)
        run: npm run build
        env:
          ASTRO_RELEASE: fixture_v0
          ASTRO_WEB_DATA: test/fixtures

      - name: Test (vitest)
        run: npm test
