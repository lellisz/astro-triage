[client]
# Oculta o botão "Deploy" (correção 8). O dashboard roda só em localhost.
toolbarMode = "minimal"

[server]
# Serve src/astro_triage/dashboard/static/ em /app/static/ (fontes locais).
enableStaticServing = true

[theme]
base = "dark"
backgroundColor = "#0a0d14"
secondaryBackgroundColor = "#11151f"
textColor = "#eef1f7"
primaryColor = "#6db3ff"
